name: Windows build and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run core regressions
        shell: pwsh
        run: |
          ./tools/Build.ps1
          dotnet run --project tests/OmniLux.Tests -c Release --no-build
          if ($LASTEXITCODE) { throw 'Core regressions failed.' }
      - name: Publish self-contained portable package
        shell: pwsh
        run: ./tools/Package.ps1 -SkipTests
      - name: Build per-user installer
        shell: pwsh
        run: |
          ./tools/Restore-InstallerTools.ps1
          ./tools/Build-Installer.ps1
      - name: Verify installer lifecycle on an interactive runner
        shell: pwsh
        run: |
          if ([Environment]::UserInteractive) {
            ./tools/Test-Installer.ps1
          } else {
            Write-Host 'Native UI checks require an interactive Windows desktop. Run tools/Build.ps1 -Test locally.'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OmniLux-windows-x64
          path: |
            dist/*
            build/validation/**/smoke.json
            build/validation/**/installer.json
          if-no-files-found: error
